<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ed1c24" />
  <title>HSV Diligentia aftelklok</title>
  <style>
    /* Self-hosted Graphik font with OTF fallback */
    @font-face { font-family: 'Graphik'; src: url('Graphik-Regular.woff2') format('woff2'), url('Graphik-Regular.woff') format('woff'), url('Graphik-Regular.otf') format('opentype'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Graphik'; src: url('Graphik-Bold.woff2') format('woff2'), url('Graphik-Bold.woff') format('woff'), url('Graphik-Bold.otf') format('opentype'); font-weight: 700; font-style: normal; font-display: swap; }

    /* Import DM Serif Display and Sofia Sans */
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Sofia+Sans:wght@400;700&display=swap');

    :root{
      --bg: #ed1c24;
      --fg: #fff;
      --accent: #fff;
      --accentText: #ed1c24;
      --gap: 1rem;
      --radius: 10px;
    }

    html, body { height: 100%; }
    body {
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100dvh;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      transition: background 0.5s, color 0.5s, font-family 0.5s;
      overflow: hidden;
      padding: calc(env(safe-area-inset-top, 0) + 12px)
               calc(env(safe-area-inset-right, 0) + 12px)
               calc(env(safe-area-inset-bottom, 0) + 12px)
               calc(env(safe-area-inset-left, 0) + 12px);
    }

    body.alt-theme { background: #0000ff; color: #fff; }
    body.alt-theme .countdown h1, body.alt-theme .btn { font-family: 'DM Serif Display', serif; }
    body.alt-theme .time-segment .number,
    body.alt-theme .time-segment .label,
    body.alt-theme #roastMessage,
    body.alt-theme #tipMessage { font-family: 'Sofia Sans', sans-serif; }
    body.alt-theme .btn { color: #0000ff; }

    .countdown {
      text-align: center;
      width: min(92vw, 720px);
      padding: clamp(1rem, 4vw, 3rem);
      box-sizing: border-box;
    }

    .countdown h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.6rem, 4.5vw, 3rem);
      font-family: 'Graphik', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-weight: 700;
      line-height: 1.15;
      word-wrap: break-word;
    }

    #timer {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: var(--gap);
      margin: 1rem 0 0.5rem;
    }

    .time-segment {
      display: grid;
      place-items: center;
      padding: 0.75rem 0.5rem;
      border-radius: var(--radius);
      background: rgba(255,255,255,0.12);
      backdrop-filter: saturate(120%) blur(4px);
    }

    .time-segment .number {
      font-size: clamp(1.8rem, 8vw, 3.2rem);
      font-weight: 800;
      line-height: 1;
    }

    .time-segment .label {
      text-transform: uppercase;
      font-size: clamp(0.7rem, 2.5vw, 1rem);
      font-family: 'Graphik', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin-top: 0.35rem;
      letter-spacing: 0.04em;
      opacity: 0.9;
    }

    .btn-row{
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: var(--gap);
      margin-top: 1rem;
    }
    @media (max-width: 520px){
      .btn-row{ grid-template-columns: 1fr; }
    }

    .btn {
      padding: clamp(0.8rem, 2.8vw, 1rem);
      font-size: clamp(0.95rem, 2.8vw, 1rem);
      font-family: 'Graphik', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--accent);
      color: var(--accentText);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.25s, color 0.25s, transform 0.06s ease;
      touch-action: manipulation;
    }
    .btn:active { transform: translateY(1px); }
    .btn:hover { background: #f4f4f4; }

    #roastMessage, #tipMessage {
      margin-top: 0.75rem;
      font-size: clamp(1.05rem, 3.4vw, 1.25rem);
      min-height: 2.2em;
      font-family: 'Graphik', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="countdown">
    <h1>HSV Diligentia '25<br>begint over…</h1>

    <div id="timer">
      <div class="time-segment" id="seg-days">
        <span id="days" class="number">0</span>
        <span class="label">dagen</span>
      </div>
      <div class="time-segment" id="seg-hours">
        <span id="hours" class="number">0</span>
        <span class="label">uren</span>
      </div>
      <div class="time-segment" id="seg-minutes">
        <span id="minutes" class="number">0</span>
        <span class="label">minuten</span>
      </div>
      <div class="time-segment" id="seg-seconds">
        <span id="seconds" class="number">0</span>
        <span class="label">seconden</span>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn" id="roastBtn" aria-controls="roastMessage">Quote me!</button>
      <button class="btn" id="toggleStyleBtn">Huisstijl</button>
      <button class="btn" id="tipBtn" aria-controls="tipMessage">Pro Tip</button>
    </div>

    <div id="roastMessage" role="status" aria-live="polite"></div>
    <div id="tipMessage" role="status" aria-live="polite"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script>
    var targetDate = new Date("September 26, 2025 17:00:00").getTime();

    function updateTimer() {
      var now = Date.now();
      var distance = targetDate - now;

      if (distance < 0) {
        document.querySelector('.countdown h1').textContent = 'Als je dit leest, doe een shotje!';
        document.getElementById('timer').style.display = 'none';
        clearInterval(intervalId);
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        return;
      }

      var days = Math.floor(distance / (1000 * 60 * 60 * 24));
      var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      var seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = days;
      document.getElementById('seg-days').style.display = days > 0 ? '' : 'none';
      document.getElementById('hours').textContent = hours;
      document.getElementById('seg-hours').style.display = hours > 0 || days > 0 ? '' : 'none';
      document.getElementById('minutes').textContent = minutes;
      document.getElementById('seg-minutes').style.display = minutes > 0 || hours > 0 || days > 0 ? '' : 'none';
      document.getElementById('seconds').textContent = seconds;
    }

    var roasts = [
      "'Heb je kleine fetish tenen?'", "'Je krijgt €5 per uur en dat willen we zien.'", "'Hoe plompiger de toren, hoe vleziger de lippen.'", "'Maar wacht...heb jij Mein Kampf gelezen?'", 
      "'Mayonaise als glijmiddel en maden in je kut, maar ze lieten je wel klaarkomen. Dus een win is een win!'", "'En ben wel vóór dat kinderen vermoord worden, maar niet dat vrouwen de keuze krijgen.'",
      "'Ik zei nog tegen Thijs: Poep niet over me heen. Maar hij kon het niet laten.'", "'Ik ga niet voor elke aardige guy op m'n knieën.'", "'Ik ben Nederlands en wit dus dat komt goed.'"
    ];

    var tips = [
      "Neem oordoppen mee in geval Tobias weer gaat overgeven.",
      "Doe geen bier op de hete stenen in de sauna, Xyrian.",
      "Wij gaan weer naar een uitkijktoren! Heb je hoogtevrees? Geen probleem!",
      "Paracetamol is geen overbodige luxe. Je eigen rum ook niet.",
      "Is dit je eerste keer? Succes.",
      "Er is altijd tijd voor (softcore) porno!"
    ];

    function vibrate(ms=30){
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    document.getElementById('roastBtn').addEventListener('click', function() {
      document.getElementById('tipMessage').textContent = '';
      var msg = roasts[Math.floor(Math.random()*roasts.length)];
      document.getElementById('roastMessage').textContent = msg;
      vibrate();
    });

    document.getElementById('tipBtn').addEventListener('click', function() {
      document.getElementById('roastMessage').textContent = '';
      var msg = tips[Math.floor(Math.random()*tips.length)];
      document.getElementById('tipMessage').textContent = msg;
      vibrate();
    });

    (function(){
      var toggleBtn = document.getElementById('toggleStyleBtn');
      toggleBtn.addEventListener('click', function(){
        document.body.classList.toggle('alt-theme');
        toggleBtn.textContent = document.body.classList.contains('alt-theme') ? 'Ouwe stylo' : 'Huisstijl';
        vibrate();
      });
    })();

    var intervalId = setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
