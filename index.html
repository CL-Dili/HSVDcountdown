<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ed1c24" />
  <title>HSV Diligentia aftelklok</title>
  <style>
    /* Import DM Serif Display and Sofia Sans before all other CSS rules */
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Sofia+Sans:wght@400;700&display=swap');

    /* Self-hosted Graphik font with OTF fallback */
    @font-face { font-family: 'Graphik'; src: url('Graphik-Regular.woff2') format('woff2'), url('Graphik-Regular.woff') format('woff'), url('Graphik-Regular.otf') format('opentype'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Graphik'; src: url('Graphik-Bold.woff2') format('woff2'), url('Graphik-Bold.woff') format('woff'), url('Graphik-Bold.otf') format('opentype'); font-weight: 700; font-style: normal; font-display: swap; }

    :root{
      --bg: #ed1c24;
      --fg: #fff;
      --accent: #fff;
      --accentText: #ed1c24;
      --gap: 1rem;
      --radius: 10px;
    }

    html, body { height: 100%; }
    body {
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100dvh;
      box-sizing: border-box;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      transition: background 0.5s, color 0.5s, font-family 0.5s;
      overflow-x: hidden;
      overflow-y: auto;
      padding: calc(env(safe-area-inset-top, 0) + 12px)
               calc(env(safe-area-inset-right, 0) + 12px)
               calc(env(safe-area-inset-bottom, 0) + 12px)
               calc(env(safe-area-inset-left, 0) + 12px);
    }

    body.alt-theme { background: #0000ff; color: #fff; }
    body.alt-theme .countdown h1, body.alt-theme .btn { font-family: 'DM Serif Display', serif; }
    body.alt-theme .time-segment .number,
    body.alt-theme .time-segment .label,
    body.alt-theme .location,
    body.alt-theme .footer,
    body.alt-theme #roastMessage,
    body.alt-theme #tipMessage { font-family: 'Sofia Sans', sans-serif; }
    body.alt-theme .btn { color: #0000ff; }

    .countdown {
      text-align: center;
      width: min(92vw, 720px);
      padding: clamp(1rem, 4vw, 3rem);
      box-sizing: border-box;
    }

    .countdown h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.6rem, 4.5vw, 3rem);
      font-family: 'Graphik', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-weight: 700;
      line-height: 1.15;
      word-wrap: break-word;
    }

    #timer {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: var(--gap);
      margin: 1rem 0 0.5rem;
    }

    .time-segment {
      display: grid;
      place-items: center;
      padding: 0.75rem 0.5rem;
      border-radius: var(--radius);
      background: rgba(255,255,255,0.12);
      backdrop-filter: saturate(120%) blur(4px);
    }

    .time-segment .number {
      font-size: clamp(1.8rem, 8vw, 3.2rem);
      font-weight: 800;
      line-height: 1;
    }

    .time-segment .label {
      text-transform: uppercase;
      font-size: clamp(0.7rem, 2.5vw, 1rem);
      font-family: 'Graphik', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin-top: 0.35rem;
      letter-spacing: 0.04em;
      opacity: 0.9;
    }

    .location {
      display: grid;
      gap: 0.25rem;
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      border-radius: var(--radius);
      background: rgba(255,255,255,0.12);
      backdrop-filter: saturate(120%) blur(4px);
      font-family: 'Graphik', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .location h2 {
      margin: 0;
      font-size: clamp(0.75rem, 2.5vw, 0.95rem);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.85;
    }

    .location address {
      margin: 0;
      font-size: clamp(1.05rem, 3.4vw, 1.25rem);
      font-style: normal;
      font-weight: 700;
      line-height: 1.35;
    }

    .location a {
      color: inherit;
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.18em;
    }

    .btn-row{
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: var(--gap);
      margin-top: 1rem;
    }
    @media (max-width: 520px){
      .btn-row{ grid-template-columns: 1fr 1fr; }
      #tipBtn{ grid-column: 1 / -1; }
      .countdown { padding-block: 1rem; }
    }

    .btn {
      padding: clamp(0.8rem, 2.8vw, 1rem);
      font-size: clamp(0.95rem, 2.8vw, 1rem);
      font-family: 'Graphik', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--accent);
      color: var(--accentText);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.25s, color 0.25s, transform 0.06s ease;
      touch-action: manipulation;
    }
    .btn:active { transform: translateY(1px); }
    .btn:hover { background: #f4f4f4; }

    #roastMessage, #tipMessage {
      margin-top: 0.75rem;
      font-size: clamp(1.05rem, 3.4vw, 1.25rem);
      min-height: 2.2em;
      font-family: 'Graphik', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      word-break: break-word;
    }

    .footer {
      margin-top: 1rem;
      font-size: clamp(0.7rem, 2.2vw, 0.85rem);
      font-family: 'Graphik', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      letter-spacing: 0.025em;
      opacity: 0.72;
    }
  </style>
</head>
<body>
  <div class="countdown">
    <h1 id="event-title" aria-live="polite">HSV Diligentia '26<br>begint over…</h1>

    <div id="timer">
      <div class="time-segment" id="seg-days">
        <span id="days" class="number">0</span>
        <span class="label">dagen</span>
      </div>
      <div class="time-segment" id="seg-hours">
        <span id="hours" class="number">0</span>
        <span class="label">uren</span>
      </div>
      <div class="time-segment" id="seg-minutes">
        <span id="minutes" class="number">0</span>
        <span class="label">gluten</span>
      </div>
      <div class="time-segment" id="seg-seconds">
        <span id="seconds" class="number">0</span>
        <span class="label">seconden</span>
      </div>
    </div>

    <section class="location" aria-labelledby="location-title">
      <h2 id="location-title">Locatie</h2>
      <address id="location-address">Nog even geheim...</address>
    </section>

    <div class="btn-row">
      <button class="btn" id="roastBtn" aria-controls="roastMessage">Quote me!</button>
      <button class="btn" id="toggleStyleBtn">Huisstijl</button>
      <button class="btn" id="tipBtn" aria-controls="tipMessage">Pro Tip</button>
    </div>

    <div id="roastMessage" role="status" aria-live="polite"></div>
    <div id="tipMessage" role="status" aria-live="polite"></div>

    <footer class="footer">HSV Diligentia ’26 · NIX18 · Maak er geen HR-casus van</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script>
    var targetDate = new Date("2026-09-18T17:00:00+02:00").getTime();
    var hasCelebrated = false;

    /* Replace these two values when the location may be revealed. */
    var eventLocation = {
      text: "Nog even geheim",
      mapsUrl: ""
    };

    function renderLocation() {
      var address = document.getElementById('location-address');
      address.textContent = '';

      if (eventLocation.mapsUrl) {
        var link = document.createElement('a');
        link.href = eventLocation.mapsUrl;
        link.textContent = eventLocation.text;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.setAttribute('aria-label', eventLocation.text + ' openen in Maps');
        address.appendChild(link);
      } else {
        address.textContent = eventLocation.text;
      }
    }

    function launchCelebration() {
      if (hasCelebrated) return;
      hasCelebrated = true;
      document.body.classList.add('event-started');

      if (typeof confetti !== 'function') return;

      [0, 850, 1700].forEach(function(delay, index) {
        setTimeout(function() {
          confetti({
            particleCount: index === 0 ? 45 : 25,
            spread: 75,
            startVelocity: 25,
            scalar: 0.9,
            origin: { y: 0.62 },
            colors: ['#ffffff', '#ffd447', '#ed1c24', '#0000ff'],
            disableForReducedMotion: true
          });
        }, delay);
      });
    }

    function updateTimer() {
      var now = Date.now();
      var distance = targetDate - now;

      if (distance <= 0) {
        document.getElementById('event-title').textContent = "HSV Diligentia '26 is begonnen! Als je dit leest, doe een shotje!";
        document.getElementById('timer').hidden = true;
        clearInterval(intervalId);
        launchCelebration();
        return;
      }

      var days = Math.floor(distance / (1000 * 60 * 60 * 24));
      var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      var seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = days;
      document.getElementById('seg-days').style.display = days > 0 ? '' : 'none';
      document.getElementById('hours').textContent = hours;
      document.getElementById('seg-hours').style.display = hours > 0 || days > 0 ? '' : 'none';
      document.getElementById('minutes').textContent = minutes;
      document.getElementById('seg-minutes').style.display = minutes > 0 || hours > 0 || days > 0 ? '' : 'none';
      document.getElementById('seconds').textContent = seconds;
    }

    var roasts = [
      "“Jij zou echt een slechte Jood zijn.” - Olivia",
      "“Is het je stiefbroer of je vriendje? Het zou toch niet erg zijn, want het is toch niet je eigen bloed.” - Olivia",
      "“Lafaard! Het is net Hilko.” - Van Riek over opstappen Timmermans",
      "“Ik dacht bijna: ben ik niet 11 maanden zwanger?” - Maartje",
      "“Kanker, Iris.” - Erik",
      "“Ik vind jou zo'n gast die een kleintje heeft.” - Avelyn over Xyrian",
      "“Ik zou eerder Nick pijpen dan Trump.” - Marius",
      "“Ik zou je niet doen, maar dat is oké, want ik ben je baas.” - Van Riek",
      "“Xyrian is een simp.” - Marius",
      "“Maar hoe ben jij dan zo dik geworden, Marius?” - Meggy",
      "“Kijk Erik behaard zijn.” - Isis",
      "“Als jij met iemand serieus aan het daten bent, is ze óf echt niet goed óf heel leuk.” - Iris",
      "“Xyrian is een soort paard.” - Avelyn",
      "“In tegenstelling tot Tobias heb ik wél een gag-reflex.” - Avelyn",
      "“Stijn, als jij achter haar aan wil gaan, is dat oké. Ik neem je vriendin wel.” - Avelyn",
      "“Heb je de lont van je tampon aangestoken of zo?” - Carolus",
      "“Ik vind alles goed, maar niet dat hij in m'n gezicht staat te spugen.” - Fleur",
      "“Er is niemand die mijn tieten gaat likken.” - Isis",
      "“Ik zou wel liever honderd SOA's hebben dan zwanger raken.” - Kiki",
      "“Maar een knecht is sowieso gewoon zwart.” - Meggy",
      "“Ze had meer tieten dan hersencellen.” - Xyrian",
      "“Je valt op alles en je bent nog steeds single.” - Nick",
      "“Stille wateren, diepe kut.” - Carolus",
      "“Ik vind HIV toch wel de top 3 ongezelligste ziektes. Kanker heeft toch wel iets knus.” - Stijn",
      "“Toch slaap ik altijd wel lekker omdat ik weet dat ik Hitler's natte droom ben.” - Thijs",
      "“Ik heb furieuze pagga's geslagen.” - Tobias"
    ];

    var tips = [
     "Neem oordoppen mee in geval Tobias weer over z'n nek gaat.",
      "RIP geen sauna dit jaar...", "Er komt een corveelijst dit jaar!",
      "Wij gaan weer naar een uitkijktoren!", "Er komt een kamerindeling dit jaar!",
      "Heb je hoogtevrees? Geen probleem!", "Heb je laagtevrees? Blijf uit de buurt van Isis.",
      "Paracetamol is geen overbodige luxe. Je eigen rum ook niet.",
      "Is dit je eerste keer? Succes.","Er is altijd tijd voor (softcore) porno!",
      "Even centraal: wijven.", "Maandag 10 moeten we pleitos!",
      "Wil je daar een lolly bij?", "NIX 18",
      "Als je niet wakker wordt van je eigen wekker, en Carolus wel, schiet hij je neer.",
      "Vergeet niet de vrijdagavond drank-activiteit!",
      "Neem je zwemkleding mee, maar we vertellen niet waarom.",
      "Vergeet je eigen sterk niet!",
      "Op zaterdagochtend 08:00 gaan we 8km hardlopen!",
      "Heb je al nummers toegevoegd aan de HSV Diligentia playlist?",
      "Maak geen biertjes open aan badkamertegels. Of eigenlijk sws niet op gekke plekken.",
      "Aankomst is mogelijk vanaf 17:00.","Stel een noodcontact in.",
      "Sta je op ONBESCHIKBAAR in Eitje?", 
      "Neem Jim NIET mee, aub.", "Als je naar de locatie fietst, krijg je gratis drank.",
      "Laat het over je heenkomen. Al dan niet letterlijk."
    ];

    function vibrate(ms=30){
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    document.getElementById('roastBtn').addEventListener('click', function() {
      document.getElementById('tipMessage').textContent = '';
      var msg = roasts[Math.floor(Math.random()*roasts.length)];
      document.getElementById('roastMessage').textContent = msg;
      vibrate();
    });

    document.getElementById('tipBtn').addEventListener('click', function() {
      document.getElementById('roastMessage').textContent = '';
      var msg = tips[Math.floor(Math.random()*tips.length)];
      document.getElementById('tipMessage').textContent = msg;
      vibrate();
    });

    (function(){
      var toggleBtn = document.getElementById('toggleStyleBtn');
      toggleBtn.addEventListener('click', function(){
        document.body.classList.toggle('alt-theme');
        toggleBtn.textContent = document.body.classList.contains('alt-theme') ? 'Ouwe stylo' : 'Huisstijl';
        vibrate();
      });
    })();

    renderLocation();
    var intervalId = setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
